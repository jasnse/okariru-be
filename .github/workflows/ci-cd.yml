name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Satu deploy pada satu waktu; deploy yang sedang berjalan tidak dibatalkan
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: mvn verify
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  build:
    name: Build & push image (GHCR)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Render .env dari variables & secrets
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_SCHEMA: ${{ vars.DB_SCHEMA }}
          APP_SECURITY_CORS_ALLOWED_ORIGIN: ${{ vars.APP_SECURITY_CORS_ALLOWED_ORIGIN }}
          SPRING_MAIL_USERNAME: ${{ vars.SPRING_MAIL_USERNAME }}
          JWT_TTL_MINUTES: ${{ vars.JWT_TTL_MINUTES }}
          APP_PORT: ${{ vars.APP_PORT }}
          JAVA_OPTS: ${{ vars.JAVA_OPTS }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          APP_UID: ${{ vars.APP_UID }}
          APP_GID: ${{ vars.APP_GID }}
          POSTGRES_DATA_DIR: ${{ vars.POSTGRES_DATA_DIR }}
          UPLOADS_DIR: ${{ vars.UPLOADS_DIR }}
          REDIS_DATA_DIR: ${{ vars.REDIS_DATA_DIR }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          FIREBASE_CREDENTIALS_B64: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
        run: bash scripts/deploy/render-env.sh

      - name: Kirim ke server & jalankan deploy
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy/deploy.sh
